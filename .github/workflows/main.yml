# Build for 4dn-cloud-infra

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  workflow_dispatch:

jobs:
  build:
    name: Validate 4dn-cloud-infra stacks build successfully

    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.9', '3.10', '3.11', '3.12' ]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: make build

      - name: Mock
        run: |
          # Write a suitable config.json for (primitive) testing
          mkdir custom
          mkdir custom/aws_creds
          echo {\"deploying_iam_user\": \"test\", \"ENCODED_ENV_NAME\": \"cgap-build\", \"account_number\": 123, \"app.kind\": \"cgap\"} > custom/config.json
          echo {\"Auth0Client\": \"test\", \"Auth0Secret\": \"test\", \"ENCODED_SECRET\": \"test\", \"S3_ENCRYPT_KEY\": \"test\"} > custom/secrets.json
      - name: Unit and offline full-stack synthesis
        run: |
          # Includes the ECS/TLS, datastore-version, IAM, CodeBuild and CLI failure matrices.
          # No Docker TTY, ambient AWS credentials or live CloudFormation validation in CI.
          make test
